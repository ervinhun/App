name: CD - Build & Distribute Android

# Adapted from docs/ci-cd/flutter-ci-cd/.github/workflows/cd-android.yml in
# the Final project repo. Differences from that template:
#   - working-directory is app/, not the repo root (the Flutter project
#     lives in a subfolder of this repo).
#   - No .fvmrc yet, same as ci.yml — Flutter resolves to the latest stable
#     release instead of a pinned version.
#   - build_runner/gen-l10n steps are left out, same reason as ci.yml: no
#     l10n.yaml or freezed/drift sources exist yet. Add them back once
#     those are set up.
#   - Signing (KEYSTORE_*) and Firebase App Distribution
#     (FIREBASE_APP_ID / FIREBASE_SERVICE_CREDENTIALS) secrets don't exist
#     yet, so those steps are each gated on their secret actually being
#     set — this lets the workflow build & upload a debug-signed APK/AAB
#     as a run artifact right now without failing, and start signing for
#     real + distributing to testers the moment those secrets are added,
#     with no further workflow change needed.
#   - android/app/build.gradle.kts still signs release builds with the
#     debug key (its own TODO comment says so) — key.properties written
#     below isn't actually read by Gradle yet. Wire that up once a real
#     keystore exists, alongside adding the KEYSTORE_* secrets.

on:
  workflow_run:
    workflows: ['Release Gates']
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  BUILD_NUMBER_OFFSET: 0

defaults:
  run:
    working-directory: app

jobs:
  # Release Gates still runs when CI failed, with every job skipped, and a workflow with only skipped jobs
  # reports "success". So check that the gate actually ran and passed.
  gates:
    name: Confirm the release gates passed
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Check verify-release-build succeeded
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name == "verify-release-build") | .conclusion')
          echo "verify-release-build: ${result:-not found}"
          [ "$result" = "success" ]

  build-android:
    name: Build Android
    needs: gates
    # A manual run skips the gate; an automatic one only builds once it passed
    if: always() && (github.event_name == 'workflow_dispatch' || needs.gates.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set Up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Set Up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve version and build number
        id: version
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d '+' -f 1)
          build_number=$((BUILD_NUMBER_OFFSET + GITHUB_RUN_NUMBER))
          echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_OUTPUT"
          echo "BASENAME=fridgefriend-app-$version-$build_number" >> "$GITHUB_OUTPUT"
          echo "Building $version ($build_number)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Dependencies
        run: flutter pub get

      # `secrets` can't be referenced in `if:` conditions, hence checking
      # presence here and gating later steps on this step's output instead.
      - name: Check for Android signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "configured=$([ -n "$KEYSTORE_BASE64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Decode Keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        if: steps.signing.outputs.configured == 'true'
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Check build configuration
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$GOOGLE_SERVER_CLIENT_ID" ]; then
            echo "::error::Set the GOOGLE_SERVER_CLIENT_ID repository variable."
            exit 1
          fi
          # Without it the app is built for the emulator's local backend (http://10.0.2.2:5092)
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error::Set the API_BASE_URL repository variable to the production API (https://...)."; exit 1 ;;
          esac

      - name: Build APK
        run: flutter build apk --release --build-number=${{ steps.version.outputs.BUILD_NUMBER }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }} --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Build appBundle
        run: flutter build appbundle --release --build-number=${{ steps.version.outputs.BUILD_NUMBER }} --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }} --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      # Once the KEYSTORE_* secrets exist, a release signed with the debug key means Gradle ignored key.properties
      # (android/app/build.gradle.kts still signs release builds with the debug key: wire key.properties up first)
      - name: Check the APK is not signed with the debug key
        if: steps.signing.outputs.configured == 'true'
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          if "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -q 'CN=Android Debug'; then
            echo "::error::The release APK is signed with the debug key although KEYSTORE_BASE64 is set."
            exit 1
          fi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${{ steps.version.outputs.BASENAME }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/${{ steps.version.outputs.BASENAME }}.aab"

      - name: Check for Firebase App Distribution secrets
        id: firebase
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: echo "configured=$([ -n "$FIREBASE_APP_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Distribute to Firebase App Distribution testers
        if: steps.firebase.outputs.configured == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          groups: testers
          file: app/dist/${{ steps.version.outputs.BASENAME }}.apk

      - name: Look for a release matching the pubspec version
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Release
        if: steps.release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.version.outputs.VERSION }}" \
            "dist/${{ steps.version.outputs.BASENAME }}.apk" \
            "dist/${{ steps.version.outputs.BASENAME }}.aab" \
            --clobber
          echo "Attached to release v${{ steps.version.outputs.VERSION }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload as Build Artifact
        if: steps.release.outputs.exists == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.BASENAME }}
          path: app/dist/
