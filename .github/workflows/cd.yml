name: CD

# Draft pipeline — real build/signing steps (Android keystore, iOS
# certificates, store upload, etc.) land once those are set up. For now this
# only handles automatic versioning: every push to main that passes CI gets
# a new semver tag and a GitHub release, computed from commit messages
# (append "(MAJOR)" or "(MINOR)" to a commit message to bump those; anything
# else bumps patch).
#
# Triggered off Release Gates completing (CI -> Release Gates -> CD), so a
# release is never tagged from a commit whose release build, API contract
# and live API checks haven't passed (see release-gates.yml).

on:
  workflow_run:
    workflows: ['Release Gates']
    types: [completed]
    branches: [main]

jobs:
  # Release Gates still runs when CI failed, with every job skipped, and a workflow with only skipped jobs
  # reports "success". So check that the gate actually ran and passed.
  gates:
    name: Confirm the release gates passed
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Check verify-release-build succeeded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.name == "verify-release-build") | .conclusion')
          echo "verify-release-build: ${result:-not found}"
          [ "$result" = "success" ]

  version:
    name: Compute next version & tag
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version_tag: ${{ steps.semver.outputs.version_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Compute next semantic version
        id: semver
        uses: paulhatch/semantic-version@a8f8f59fd7f0625188492e945240f12d7ad2dca3 # v5.4.0
        with:
          tag_prefix: 'v'
          major_pattern: '(MAJOR)'
          minor_pattern: '(MINOR)'
          bump_each_commit: true

      - name: Create and push tag
        run: |
          git tag "${{ steps.semver.outputs.version_tag }}"
          git push origin "${{ steps.semver.outputs.version_tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.semver.outputs.version_tag }}
          generate_release_notes: true

  build-android:
    name: Build Android (TODO)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder — signing/build not implemented yet
        run: |
          echo "TODO: build & sign an Android artifact for ${{ needs.version.outputs.version_tag }} once a keystore is set up."
          echo "See docs/ci-cd/flutter-ci-cd in the Final project repo for a reference implementation (cd-android.yml)."
